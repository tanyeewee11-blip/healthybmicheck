  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #F7F4EF; --surface: #FFFFFF; --ink: #1A1714;
      --ink2: #6B6560; --ink3: #A09A94; --accent: #2D6A4F;
      --accent-light: #D8EFE4; --border: #E5E0D8;
      --radius: 16px; --shadow: 0 2px 16px rgba(26,23,20,0.07);
    }
    body { font-family: 'DM Sans', sans-serif; background: var(--bg); color: var(--ink); min-height: 100vh; display: flex; flex-direction: column; }
    header {
      background: var(--ink); color: #fff; padding: 16px 24px;
      display: flex; align-items: center; justify-content: space-between;
      border-bottom: 2.5px solid #2D6A4F;
    }
    .logo { font-family: 'DM Serif Display', serif; font-size: 1.25rem; }
    .logo span { color: #7EC8A4; }
    header a { text-decoration: none; color: inherit; }
    nav { display: flex; align-items: center; gap: 4px; }
    .nav-toggle { display: none; background: none; border: none; cursor: pointer; padding: 6px; }
    .nav-toggle span { display: block; width: 20px; height: 2px; background: #fff; margin: 4px 0; border-radius: 2px; transition: all .25s; }
    @media (max-width: 640px) {
      .nav-toggle { display: block; }
      nav { position: absolute; top: 56px; right: 0; left: 0; background: var(--ink); flex-direction: column; align-items: flex-start; gap: 0; padding: 8px 16px 16px; display: none; border-bottom: 2px solid #2D6A4F; z-index: 100; }
      nav.open { display: flex; }
      nav a { width: 100%; padding: 10px 8px; font-size: .9rem; border-radius: 8px; }
      header { position: relative; }
    }
    nav a {
      color: rgba(255,255,255,0.6); text-decoration: none;
      font-size: .85rem; padding: 6px 12px; border-radius: 8px;
      transition: color .2s, background .2s;
    }
    nav a:hover { color: #fff; background: rgba(255,255,255,0.08); }
    main {
      flex: 1; display: flex; align-items: center; justify-content: center;
      padding: 48px 24px;
    }
    .card {
      background: var(--surface); border-radius: var(--radius);
      box-shadow: var(--shadow); padding: 48px 40px;
      max-width: 520px; width: 100%; text-align: center;
    }
    .error-code {
      font-family: 'DM Serif Display', serif;
      font-size: clamp(4rem, 15vw, 6rem);
      line-height: 1; color: var(--accent); margin-bottom: 16px;
    }
    h1 { font-family: 'DM Serif Display', serif; font-size: 1.75rem; margin-bottom: 12px; }
    p { color: var(--ink2); line-height: 1.7; margin-bottom: 32px; }
    .btn-group { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; }
    .btn-primary {
      background: var(--accent); color: #fff; border: none;
      padding: 12px 24px; border-radius: 10px; font-family: 'DM Sans', sans-serif;
      font-size: .9rem; font-weight: 600; text-decoration: none;
      transition: opacity .2s;
    }
    .btn-primary:hover { opacity: 0.88; }
    .btn-secondary {
      background: var(--surface); color: var(--ink);
      border: 1.5px solid var(--border); padding: 12px 24px;
      border-radius: 10px; font-family: 'DM Sans', sans-serif;
      font-size: .9rem; font-weight: 500; text-decoration: none;
      transition: border-color .2s;
    }
    .btn-secondary:hover { border-color: var(--accent); }
    footer {
      text-align: center; padding: 24px;
      font-size: .8rem; color: var(--ink3); border-top: 1px solid var(--border);
    }
    footer a { color: var(--ink3); text-decoration: none; margin: 0 8px; }
    footer a:hover { color: var(--accent); }
  </style>

</header>

<script>
  // Mobile nav toggle
  (function() {
    var btn = document.querySelector('.nav-toggle');
    var nav = document.querySelector('nav');
    if (btn && nav) {
      btn.addEventListener('click', function() {
        nav.classList.toggle('open');
      });
      document.addEventListener('click', function(e) {
        if (!e.target.closest('header')) nav.classList.remove('open');
      });
    }
  })();
</script>
