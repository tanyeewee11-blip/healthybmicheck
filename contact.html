    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    label { display: block; font-size: 0.8rem; font-weight: 600; text-transform: uppercase; letter-spacing: .04em; color: #6B6560; margin-bottom: 6px; }
    input, textarea {
      width: 100%; border: 1.5px solid #E5E0D8; border-radius: 10px;

      background: #fff; outline: none; margin-bottom: 16px;
    }
    input:focus, textarea:focus { border-color: #2D6A4F; }
    textarea { min-height: 120px; resize: vertical; }
    button {
      background: #1A1714; color: #fff; border: none; border-radius: 12px;
      padding: 14px 32px; font-family: 'DM Serif Display', serif; font-size: 1rem;
      cursor: pointer;
    }

<header><div class="logo"><a href="index.html" style="color:#fff;text-decoration:none">bmi<span>calc</span>.app</a></div></header>
<div class="content">
  <h1>Contact Us</h1>
  <p>Have a question, suggestion, or spotted an issue? We'd love to hear from you.</p>
  <form action="mailto:hello@bmicalc.app" method="post" enctype="text/plain">
    <label>Name</label>
    <input type="text" name="name" placeholder="Your name" required>
    <label>Email</label>
    <input type="email" name="email" placeholder="your@email.com" required>
    <label>Message</label>
    <textarea name="message" placeholder="Your message..." required></textarea>
    <button type="submit">Send Message</button>
  </form>
</div>
